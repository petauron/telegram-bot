name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      failed_run_id:
        description: Failed release run whose original checked draft should be recovered
        required: true
        type: string
permissions:
  contents: read
env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    name: Prepare release from checked main
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      actions: read
      checks: read
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.recovery.outputs.release_created || steps.release.outputs.release_created }}
      release_sha: ${{ steps.recovery.outputs.sha || steps.release.outputs.sha }}
      release_tag: ${{ steps.recovery.outputs.tag_name || steps.release.outputs.tag_name }}
      draft_pending: ${{ steps.current.outputs.draft_pending }}
    steps:
      - name: Wait for the exact source CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for attempt in $(seq 1 180); do
            result=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&head_sha=$GITHUB_SHA&per_page=100" \
              --jq '.workflow_runs | sort_by(.run_number) | last | if . == null then "waiting" elif .status == "completed" then .conclusion else "waiting" end')
            case "$result" in
              success) exit 0 ;;
              waiting) sleep 10 ;;
              *) echo "Source CI did not succeed: $result" >&2; exit 1 ;;
            esac
          done
          echo "Timed out waiting for source CI" >&2
          exit 1
      - name: Require this run to match protected main
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo "matches=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$GITHUB_EVENT_NAME" = push ] && gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq 'any(.draft)' | grep -qx true; then
            echo "draft_pending=true" >> "$GITHUB_OUTPUT"
            echo 'An unpublished draft is pending. Recover its original failed run before preparing another release.'
          fi
      - name: Create release without updating the next version PR
        if: github.event_name == 'push' && steps.current.outputs.matches == 'true' && steps.current.outputs.draft_pending != 'true'
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ github.token }}
          target-branch: main
          skip-github-pull-request: true
      - name: Require the release to use this run's checked source
        if: steps.release.outputs.release_created == 'true'
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: test "$RELEASE_SHA" = "$GITHUB_SHA"
      - name: Recover only the original checked draft from a failed release run
        if: github.event_name == 'workflow_dispatch' && steps.current.outputs.matches == 'true'
        id: recovery
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_RUN_ID: ${{ inputs.failed_run_id }}
        run: |
          set -eu
          printf '%s' "$FAILED_RUN_ID" | grep -Eq '^[1-9][0-9]{0,19}$'
          gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .protected | grep -qx true
          original=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RUN_ID")
          printf '%s' "$original" | jq -e --arg repo "$GITHUB_REPOSITORY" '
            .repository.full_name == $repo and .event == "push" and
            .path == ".github/workflows/release.yml" and .head_branch == "main" and
            .status == "completed" and .conclusion == "failure"' >/dev/null
          sha=$(printf '%s' "$original" | jq -er .head_sha)
          printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'
          jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RUN_ID/jobs?per_page=100")
          printf '%s' "$jobs" | jq -e '
            (.jobs | any(.name == "Prepare release from checked main" and .conclusion == "success")) and
            (.jobs | any(.name == "Publish GitHub release" and .conclusion == "success") | not)' >/dev/null
          echo 'Verifying the original source Application checks and all three CodeQL analysis jobs'
          gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?per_page=100" --jq '
            .check_runs as $checks |
            ["Application checks", "Analyze (actions)", "Analyze (python)", "Analyze (javascript-typescript)"] |
            all(. as $name | $checks | any(.name == $name and .conclusion == "success"))' | grep -qx true
          version=$(gh api "repos/$GITHUB_REPOSITORY/contents/VERSION?ref=$sha" --jq .content | base64 --decode)
          printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          tag="v$version"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish,tagName |
            jq -e --arg sha "$sha" --arg tag "$tag" '
              .isDraft == true and .targetCommitish == $sha and .tagName == $tag' >/dev/null
          echo 'release_created=true' >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag" >> "$GITHUB_OUTPUT"

  source:
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
    needs: prepare
    if: needs.prepare.outputs.release_created == 'true'
    name: Verify release source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # GitHub hides draft releases from tokens without push access.
      # This trusted-main job needs write permission to verify the draft.
      contents: write
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          test "$(cat VERSION)" = "${RELEASE_TAG#v}"
          test "$(jq -r '."."' .release-please-manifest.json)" = "${RELEASE_TAG#v}"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish,tagName |
            jq -e --arg sha "$RELEASE_SHA" --arg tag "$RELEASE_TAG" '
              .isDraft == true and .targetCommitish == $sha and .tagName == $tag' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/check-runs" --jq '.check_runs | any(.name == "Application checks" and .conclusion == "success")' | grep -qx true
  image:
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
    name: Image ${{ matrix.arch }}
    needs: [prepare, source]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        id: build
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/petauron/telegram-bot:${{ needs.prepare.outputs.release_tag }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/petauron/telegram-bot
            org.opencontainers.image.revision=${{ needs.prepare.outputs.release_sha }}
          cache-from: type=gha,scope=telegram-bot-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=telegram-bot-${{ matrix.arch }}
      - env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          printf '%s' "$DIGEST" > "digest-$ARCH.txt"
          gh release upload "$RELEASE_TAG" "digest-$ARCH.txt" --clobber
  publish:
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
    name: Publish GitHub release
    needs: [prepare, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      packages: write
    steps:
      - name: Download architecture digests from the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p digests
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir digests --pattern 'digest-*.txt'
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image=ghcr.io/petauron/telegram-bot
          grep -Eq '^sha256:[0-9a-f]{64}$' digests/digest-amd64.txt
          grep -Eq '^sha256:[0-9a-f]{64}$' digests/digest-arm64.txt
          docker buildx imagetools create --tag "$image:$RELEASE_TAG" "$image@$(cat digests/digest-amd64.txt)" "$image@$(cat digests/digest-arm64.txt)"
          docker buildx imagetools inspect "$image:$RELEASE_TAG" --raw > image-index.json
          printf '%s@sha256:%s\n' "$image" "$(sha256sum image-index.json | cut -d' ' -f1)" > image.txt
          sha256sum image-index.json image.txt > SHA256SUMS
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          gh release upload "$RELEASE_TAG" image-index.json image.txt SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  release-pr:
    name: Prepare next version PR and start its CI
    needs: [prepare, publish]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.draft_pending != 'true' && (needs.publish.result == 'success' || (needs.prepare.outputs.release_created != 'true' && needs.publish.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - name: Maintain version PR without publishing
        id: release_pr
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ github.token }}
          target-branch: main
          skip-github-release: true
      # GITHUB_TOKEN-created PR workflows can require manual approval.
      # Explicit dispatch starts the existing CI on the version PR branch.
      - name: Dispatch CI for the version PR
        if: steps.release_pr.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.release_pr.outputs.pr }}
        run: |
          branch=$(printf '%s' "$RELEASE_PR" | jq -er '.headBranchName')
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
