name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    name: Verify release source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test "$(cat VERSION)" = "${GITHUB_REF_NAME#v}"
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" --jq '.check_runs | any(.name == "Application checks" and .conclusion == "success")' | grep -qx true
  image:
    name: Image ${{ matrix.arch }}
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        id: build
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/petauron/telegram-bot:${{ github.ref_name }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/petauron/telegram-bot
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=telegram-bot-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=telegram-bot-${{ matrix.arch }}
      - env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: mkdir -p digests && printf '%s' "$DIGEST" > "digests/$ARCH"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
  publish:
    name: Publish GitHub release
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image=ghcr.io/petauron/telegram-bot
          docker buildx imagetools create --tag "$image:$GITHUB_REF_NAME" "$image@$(cat digests/amd64)" "$image@$(cat digests/arm64)"
          docker buildx imagetools inspect "$image:$GITHUB_REF_NAME" --raw > image-index.json
          printf '%s@sha256:%s\n' "$image" "$(sha256sum image-index.json | cut -d' ' -f1)" > image.txt
          sha256sum image-index.json image.txt > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" image-index.json image.txt SHA256SUMS --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --title "$GITHUB_REF_NAME" --notes 'Multi-architecture image for Vastora installation. See image.txt for the immutable reference.'
