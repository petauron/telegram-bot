version: 2
# Routine version PRs are grouped monthly and limited to patch/minor updates so
# dependency churn does not fan out into weekly full-CI runs. Major upgrades
# are evaluated manually; Dependabot security updates remain enabled.
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
      timezone: Asia/Singapore
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      pip-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: monthly
      timezone: Asia/Singapore
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      web-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
      timezone: Asia/Singapore
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # Keep the reviewed Python minor line (3.12-slim); evaluate minor bumps manually.
      - dependency-name: python
        update-types:
          - version-update:semver-minor
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      timezone: Asia/Singapore
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
